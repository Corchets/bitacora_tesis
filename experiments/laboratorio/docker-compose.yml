# Spike #29: una corrida, no un servicio. Se usa con `docker compose run --rm`.
# GAMA=alta  -> mem_limit 2g   (esta corrida; 1g hasta 2026-09-28, ver GUIA)
# GAMA=media -> mem_limit 512m (prevista, no correr en #29)
# GAMA=baja  -> mem_limit 256m (prevista, no correr en #29)
services:
  corrida:
    build: .
    # Techo de RAM de los dos ayudantes juntos. Cambiar junto con GAMA.
    mem_limit: 2g
    # Sin GPUs: el contenedor no ve placa de escritorio. A proposito no hay
    # `cpus:`: los hilos son config del proceso (hilos_asr/hilos_detector).
    environment:
      GAMA: ${GAMA:-alta}
      HF_HUB_CACHE: /models/hf
      # Tope para que ONNX/OpenMP no disparen hilos de mas. Alta=6, media=4, baja=2.
      OMP_NUM_THREADS: "6"
      OPENBLAS_NUM_THREADS: "6"
      MKL_NUM_THREADS: "6"
      # LLM local (OpenAI-compatible). Vacio = goteo sin opinion; incendio por reglas igual corre.
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-meta-llama/Llama-3.2-1B-Instruct}  # con el servicio slm: llama3.2:1b-instruct-q4_K_M
      DETECTOR_MODO: ${DETECTOR_MODO:-clasificador}
      # llm | encoder | cascada. La cascada usa LLM_BASE_URL=http://slm:11434/v1 solo en zona gris.
      DETECTOR: ${DETECTOR:-llm}
      ENCODER_MODEL: ${ENCODER_MODEL:-pysentimiento/robertuito-base-uncased}
      SEMILLAS_PATH: ${SEMILLAS_PATH:-/data/entrenamiento/semillas.json}
    volumes:
      # WAV requerido por compose aunque corras --texto (ahi se ignora: WAV=/tmp/nada.wav alcanza).
      - ${WAV:?Definí WAV=/ruta/a/llamada.wav (WAV 16kHz mono, fuera de Git)}:/data/llamada.wav:ro
      - hf-cache:/models/hf
      - ./artifacts:/app/artifacts
      # Semillas del encoder: fuera de Git (texto de terceros). Ver GUIA-CORRIDA-LABORATORIO.md.
      - ${ENTRENAMIENTO:-./artifacts}:/data/entrenamiento:ro

  # SLM de la zona gris. Se levanta aparte: `docker compose up -d slm`.
  # Su memoria no la ve mem_limit de corrida: se lee del cgroup y se suma a mano.
  slm:
    image: ollama/ollama
    profiles: ["cascada"]
    environment:
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_KEEP_ALIVE: "-1"
      # 4096 (defecto) reserva ~1.4 GB con llama3.2:1b; 1024 alcanza para sistema + 5 turnos recortados.
      OLLAMA_CONTEXT_LENGTH: "1024"
    volumes:
      - ollama-models:/root/.ollama

volumes:
  hf-cache:
  ollama-models:
